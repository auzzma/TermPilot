[package]
name = "termpilot-engine"
version.workspace = true
edition.workspace = true
license = "AGPL-3.0-or-later"

[features]
# Developer-only protocol validation with the portable codec; production macOS uses VideoToolbox.
portable-media-validation = []

[dependencies]
termpilot-core = { path = "../../crates/termpilot-core" }
termpilot-ai = { path = "../../crates/termpilot-ai" }
anyhow = "1"
russh = { version = "=0.63.3", default-features = false, features = ["ring", "rsa", "flate2"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
sha1 = "0.10"
hmac = "0.12"
pbkdf2 = "0.12"
crypto-bigint = "=0.7.5"
hex = "0.4"
flate2 = "1"
des = "0.8"
aes = "0.8"
cipher = "0.4"
rsa = "0.9"
rand = "0.8"
rand10 = { package = "rand", version = "=0.10.3" }
subtle = "2"
libc = "0.2"
zeroize = "1"
signature = "3"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
encoding_rs = "0.8"
url = "2"
percent-encoding = "2"
plist = { version = "=1.10.1", default-features = false }


[build-dependencies]
serde_json = "1"

[target.'cfg(windows)'.dependencies]
socket2 = "0.6.5"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_IO", "Win32_Networking_WinSock", "Win32_System_Diagnostics_Debug"] }
