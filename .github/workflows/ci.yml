name: All clients and shared core

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    uses: ./.github/workflows/build-packages.yml
  mobile:
    uses: ./.github/workflows/mobile.yml
