name: ci

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Resolve packages
        run: swift package resolve
      - name: Build debug
        run: swift build --configuration debug
      - name: Build release
        run: swift build --configuration release
      - name: Test
        run: swift test --parallel
      - name: Build application bundle
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            ./scripts/build-app.sh "${GITHUB_REF_NAME#v}"
          else
            ./scripts/build-app.sh
          fi
      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: TermPilot-release-assets
          path: |
            dist/TermPilot-*-arm64.zip
            dist/TermPilot-*-x86_64.zip
            dist/TermPilot-*-universal.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v7
        with:
          name: TermPilot-release-assets
          path: release-assets
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/TermPilot-*-arm64.zip
            release-assets/TermPilot-*-x86_64.zip
            release-assets/TermPilot-*-universal.zip
            release-assets/SHA256SUMS.txt
          fail_on_unmatched_files: true
          generate_release_notes: true
