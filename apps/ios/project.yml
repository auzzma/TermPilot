name: TermPilot
options:
  bundleIdPrefix: com.termpilot
  deploymentTarget:
    iOS: '17.0'
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    revision: dd2fb8ac5b861e7bf617c872895e338f38165648
settings:
  base:
    SWIFT_VERSION: '5.0'
    ARCHS: arm64
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: '0.2.1'
    CURRENT_PROJECT_VERSION: '13'
    TERMPILOT_APP_BUNDLE_ID: com.termpilot.app
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    HEADER_SEARCH_PATHS: '$(SRCROOT)/../../bindings/mobile'
    SWIFT_INCLUDE_PATHS: '$(SRCROOT)/../../bindings/mobile'
    LIBRARY_SEARCH_PATHS: '$(SRCROOT)/../../target/$(TERMPILOT_RUST_TARGET)/release'
    OTHER_LDFLAGS: '$(inherited) $(SRCROOT)/../../target/$(TERMPILOT_RUST_TARGET)/release/libtermpilot_mobile.a -lsqlite3 -lz -lc++ -liconv -lresolv -framework Security -framework SystemConfiguration -framework AudioToolbox -framework CoreAudio -framework AVFoundation -framework CoreMedia -framework CoreVideo -framework VideoToolbox'
    'TERMPILOT_RUST_TARGET[sdk=iphoneos*]': aarch64-apple-ios
    'TERMPILOT_RUST_TARGET[sdk=iphonesimulator*]': aarch64-apple-ios-sim
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: TermPilot
    INFOPLIST_KEY_NSCameraUsageDescription: Scan an encrypted TermPilot cloud configuration code to add this device.
    INFOPLIST_KEY_NSLocalNetworkUsageDescription: TermPilot connects to the servers you select on your local network.
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIFileSharingEnabled: NO
    INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: 'UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight'
targets:
  TermPilot:
    type: application
    platform: iOS
    sources: [Sources, Resources, ../../bindings/swift/SyncUI/Sources/TermPilotSyncUI, ../../bindings/swift/RemoteDiagnostics/Sources/TermPilotRemoteDiagnostics]
    info:
      path: .generated/Info.plist
      properties:
        BGTaskSchedulerPermittedIdentifiers: [com.termpilot.app.transfer.*]
        UIBackgroundModes: [processing]
    dependencies:
      - package: SwiftTerm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TERMPILOT_APP_BUNDLE_ID)
  TermPilotTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
      - ../../tests/mobile/media_probe.c
      - ../../tests/mobile/avc_probe.c
      - path: ../../tests/media-codec/h264.fixture
        buildPhase: resources
      - path: ../../tests/media-codec/eld-sbr.fixture
        buildPhase: resources
    dependencies:
      - target: TermPilot
  TermPilotUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: TermPilot
schemes:
  TermPilot:
    build:
      targets:
        TermPilot: all
    test:
      targets: [TermPilotTests, TermPilotUITests]
